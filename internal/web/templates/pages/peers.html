{{define "content"}}
<h3>通知设置</h3>
<p><small>打开开关后，该对话的新消息会转发到账号配置的渠道。列表不全时在"我的 TG"里点刷新对话。</small></p>
<select onchange="location='{{url "/peers"}}'+(this.value?'?account='+this.value:'')" style="max-width:360px">
  <option value="">全部账号</option>
  {{range .Accounts}}<option value="{{.ID}}" {{if eq .ID $.Selected}}selected{{end}}>{{.TgUserID}} {{.FirstName}}</option>{{end}}
</select>
{{if .Peers}}
<table class="r">
<thead><tr><th>对话</th><th>类型</th><th>监控转发</th></tr></thead>
<tbody>{{range .Peers}}
<tr><td data-label="对话">{{name .Username .Title 0}}</td><td data-label="类型">{{.Kind}}</td>
<td data-label="监控"><input type="checkbox" role="switch" {{if .Monitored}}checked{{end}}
  hx-post="{{url "/peers/"}}{{.ID}}/toggle" hx-swap="none"></td></tr>
{{end}}</tbody>
</table>
<p>{{if .Paged}}<a href="{{url "/peers"}}{{if .Selected}}?account={{.Selected}}{{end}}">第一页</a>{{end}} {{if .Next}}<a href="{{url "/peers"}}?after={{.Next}}{{if .Selected}}&account={{.Selected}}{{end}}">下一页 →</a>{{end}}</p>
{{else}}<p>{{if .Paged}}没有更多了，<a href="{{url "/peers"}}">回第一页</a>{{else}}还没有对话。先添加 TG 账号。{{end}}</p>{{end}}
{{end}}
