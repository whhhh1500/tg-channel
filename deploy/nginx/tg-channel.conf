# ntfy 与 bark 各一个子域。把 DOMAIN 换成自己的域名，放到 /etc/nginx/sites-enabled/tg-channel.conf
# 证书：certbot certonly --nginx -d ntfy.DOMAIN -d bark.DOMAIN

server {
    listen 80;
    server_name ntfy.DOMAIN bark.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ntfy：手机端是长连接 / WebSocket，不能让 Nginx 掐断
server {
    listen 443 ssl;
    server_name ntfy.DOMAIN;
    ssl_certificate /etc/letsencrypt/live/ntfy.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntfy.DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3m;
        proxy_send_timeout 3m;
    }
}

# bark
server {
    listen 443 ssl;
    server_name bark.DOMAIN;
    ssl_certificate /etc/letsencrypt/live/ntfy.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntfy.DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
